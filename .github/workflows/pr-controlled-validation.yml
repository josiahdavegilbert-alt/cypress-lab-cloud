name: Temporary PR 14 controlled Chrome validation
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: [.github/workflows/pr-controlled-validation.yml]
permissions:
  contents: read
concurrency:
  group: cypress-cloud-smoke
  cancel-in-progress: false
jobs:
  controlled-validation:
    if: >-
      github.repository == 'josiahdavegilbert-alt/cypress-lab-cloud' &&
      github.event.pull_request.number == 14 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/capability-expansion' &&
      github.actor == 'josiahdavegilbert-alt' &&
      github.triggering_actor == 'josiahdavegilbert-alt'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Restrict this activation to the reviewed parent
        run: |
          test "$(git rev-parse HEAD^)" = '0750e36c0f19277c88dd0a96c4e363d0b22659d7'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/pr-controlled-validation.yml'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Test controlled fixtures and evidence policies
        run: node --test scripts/tests/*.test.cjs
      - name: Record committed lockfile
        run: |
          git ls-files --error-unmatch package-lock.json
          sha256sum package-lock.json > "$RUNNER_TEMP/pr-validation-lock.sha256"
      - name: Install only locked dependencies
        id: install
        run: |
          node scripts/install-diagnostics.cjs
          sha256sum --check "$RUNNER_TEMP/pr-validation-lock.sha256"
      - name: Validate fixed controlled capabilities in Chrome
        id: capabilities
        run: node scripts/run-capabilities.cjs
      - name: Run two fixed Chrome rehearsals without retries
        id: rehearsal
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/run-rehearsal.cjs
      - name: Independently evaluate rehearsal evidence
        if: ${{ !cancelled() && steps.rehearsal.outcome == 'success' }}
        run: node scripts/rehearsal-readiness.cjs rehearsal-output
      - name: Preserve private controlled evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr14-controlled-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            rehearsal-output/
            capability-result.json
            capability-evidence.jsonl
            install-diagnostic.json
            cypress/screenshots/capabilities/**/*.png
      - name: Retrieve same-run evidence
        if: ${{ !cancelled() && steps.rehearsal.outcome == 'success' && steps.capabilities.outcome == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr14-controlled-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pr14-downloaded
      - name: Verify downloaded identity, counters and screenshot hashes
        if: ${{ !cancelled() && steps.rehearsal.outcome == 'success' && steps.capabilities.outcome == 'success' }}
        run: |
          node scripts/rehearsal-readiness.cjs .pr14-downloaded/rehearsal-output
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const {execFileSync} = require('node:child_process');
          const root = '.pr14-downloaded';
          const report = JSON.parse(fs.readFileSync(`${root}/capability-result.json`));
          assert.equal(report.verified, true);
          assert.equal(report.commit, execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim());
          assert.equal(report.runId, process.env.GITHUB_RUN_ID);
          assert.equal(report.attempt, process.env.GITHUB_RUN_ATTEMPT);
          assert.equal(report.tests, 9); assert.equal(report.passed, 8); assert.equal(report.failed, 1);
          assert.equal(report.expectedFailure, true); assert.equal(report.screenshotsOK, true);
          assert.deepEqual(report.counters, {browserPosts:2, directGets:1});
          const {CHECKS} = require('./scripts/capability-policy.cjs');
          assert.deepEqual(Object.keys(report.verifiedChecks).sort(), [...CHECKS].sort());
          assert.ok(CHECKS.every(id => report.verifiedChecks[id] === true));
          const evidence = fs.readFileSync(`${root}/capability-evidence.jsonl`,'utf8').trim().split('\n').map(JSON.parse);
          assert.deepEqual(evidence.map(entry=>entry.id).sort(), [...CHECKS].sort());
          function walk(dir) {return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(dir,e.name)):[path.join(dir,e.name)]);}
          const files = walk(`${root}/cypress/screenshots/capabilities`).filter(file=>file.endsWith('.png'));
          assert.equal(files.length, report.screenshots.length);
          for (const shot of report.screenshots) {
            const matches = files.filter(file=>path.basename(file)===shot.file); assert.equal(matches.length,1);
            const bytes = fs.readFileSync(matches[0]); assert.equal(bytes.length,shot.bytes);
            assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),shot.sha256);
            assert.equal(bytes.subarray(0,8).toString('hex'),'89504e470d0a1a0a');
          }
          console.log(JSON.stringify({gate:'downloaded-controlled-capabilities',verified:true,commit:report.commit,runId:report.runId,attempt:report.attempt,screenshots:files.length,competitionReady:false}));
          NODE
          sha256sum --check "$RUNNER_TEMP/pr-validation-lock.sha256"
          git diff --exit-code -- package.json package-lock.json
