name: Cypress cloud smoke
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: cypress-cloud-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: >-
      github.actor == 'josiahdavegilbert-alt' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == 'josiahdavegilbert-alt' &&
       github.event.issue.title == '[Cypress] Run smoke'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # verified v6 pin
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund
      - name: Run fixed smoke spec in Chrome
        id: tests
        run: npm run test:e2e -- --spec cypress/e2e/smoke.cy.js
      - name: Report outcome to request issue
        if: ${{ always() && !cancelled() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/report-result.cjs
