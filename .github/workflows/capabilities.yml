name: Controlled Cypress capabilities
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cypress-cloud-smoke
  cancel-in-progress: false
jobs:
  capabilities:
    if: github.actor == 'josiahdavegilbert-alt'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Unit-test fixture and verdict policy
        run: node --test scripts/tests/*.test.cjs
      - name: Install locked dependencies
        run: node scripts/install-diagnostics.cjs
      - name: Validate controlled browser capabilities
        run: node scripts/run-capabilities.cjs
      - name: Preserve evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capabilities-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            capability-result.json
            capability-evidence.jsonl
            install-diagnostic.json
            cypress/screenshots/capabilities/**/*.png
