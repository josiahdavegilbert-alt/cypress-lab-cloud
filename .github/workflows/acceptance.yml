name: Cypress acceptance validation
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: cypress-cloud-smoke
  cancel-in-progress: false
jobs:
  acceptance:
    if: >-
      github.actor == 'josiahdavegilbert-alt' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == 'josiahdavegilbert-alt' &&
       github.event.issue.title == '[Cypress] Run acceptance'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Install locked dependencies
        id: install
        run: node scripts/install-diagnostics.cjs
      - name: Validate browser network and expected failure
        id: validation
        run: node scripts/launch-acceptance.cjs
      - name: Preserve controlled diagnostic files
        id: upload
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            acceptance-result.json
            acceptance-network.jsonl
            install-diagnostic.json
            cypress/screenshots/acceptance/**/*.png
            package-lock.json
      - name: Download preserved evidence for round-trip verification
        id: download
        if: ${{ always() && !cancelled() && steps.upload.outcome == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: restored-acceptance
      - name: Verify restored screenshots and publish asset report
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: node scripts/acceptance-assets.cjs
      - name: Publish bounded acceptance report
        if: ${{ always() && !cancelled() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: node scripts/acceptance.cjs --report
