name: Cypress acceptance validation
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: cypress-cloud-smoke
  cancel-in-progress: false
jobs:
  acceptance:
    if: >-
      github.actor == 'josiahdavegilbert-alt' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == 'josiahdavegilbert-alt' &&
       github.event.issue.title == '[Cypress] Run acceptance'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund
      - name: Validate browser network and expected failure
        id: validation
        run: node scripts/acceptance.cjs
      - name: Publish bounded acceptance report
        if: ${{ always() && !cancelled() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: node scripts/acceptance.cjs --report
